name: build
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      # Tests in tests/ are DB-free (they read fixtures, never touch Neo4j),
      # so no neo4j service is needed here. If ftmg/backend.py or transform.py
      # gain coverage, add a services.neo4j container + FTMG_* env vars.
      - name: Run the tests
        run: make test

  # Single pure-Python wheel (py3-none-any) + sdist for PyPI. Building once is
  # correct: the artifact is version-independent, and the build-provenance
  # attestation stays tied to one set of bytes.
  wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tool
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
