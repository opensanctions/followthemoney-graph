[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "followthemoney-graph"
version = "0.1.0"
description = "Labeled property graph transformer for followthemoney data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "OpenSanctions", email = "info@opensanctions.org" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">= 3.12"
dependencies = [
    "followthemoney >= 4.5.0",
    "neo4j >= 6.0.0",
    "stringcase >= 1.2.0",
    "pydantic >= 2.7.0",
    "pydantic-settings >= 2.0.0",
    "click >= 8.0.0",
    "PyYAML >= 5.4.1",
]

[project.urls]
Documentation = "https://followthemoney.tech/"
Repository = "https://github.com/opensanctions/followthemoney-graph.git"
Issues = "https://github.com/opensanctions/followthemoney-graph/issues"

[project.optional-dependencies]
dev = [
    "pip>=10.0.0",
    "bump2version",
    "wheel>=0.29.0",
    "twine",
    "build",
    "mypy",
    "ruff",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
    "coverage>=4.1",
]

[project.scripts]
ftmg = "ftmg.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["ftmg"]

[tool.hatch.build.targets.sdist]
only-include = ["ftmg", "LICENSE", "README.md"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"

# These dependencies ship no type stubs; silence the missing-import noise
# rather than vendoring stubs for third-party packages.
[[tool.mypy.overrides]]
module = ["stringcase", "neo4j", "pydantic_settings"]
ignore_missing_imports = true
